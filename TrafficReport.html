<!doctype html>
<html lang="en">

<meta charset="utf-8">
<title>Traffic Report</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --border: #e3e7ec; --text: #24292f;
    --muted: #656d76; --accent: #2c5f8a; --accent-dark: #1f3d5c;
    --band: #f2f4f7; --grp: #e7edf3; --grp-line: #2c5f8a; --hover: #eef4fb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
         background: var(--bg); color: var(--text); font-size: 13px; }
  header { background: var(--accent-dark); color: #39ff14; padding: 14px 24px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { font-size: 12px; opacity: 0.85; margin-top: 4px; }
  main { padding: 14px 24px 40px; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: #fff; color: var(--accent); padding: 6px 14px; cursor: pointer;
                font-size: 13px; border-right: 1px solid var(--border); }
  .seg button:last-child { border-right: 0; }
  .seg button.active { background: var(--accent); color: #fff; }
  .grow { flex: 1; }
  input#search { border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 13px; min-width: 200px; }
  button.link { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 13px; text-decoration: underline; }
  button.export { background: var(--accent); color: #fff; border: 0; border-radius: 6px;
                  padding: 6px 14px; cursor: pointer; font-size: 13px; }
  button.export:hover { background: var(--accent-dark); }
  .wrap { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
          overflow: auto; display: inline-block; max-width: 100%; vertical-align: top; }
  table { border-collapse: collapse; width: auto; }
  th, td { padding: 4px 10px; white-space: nowrap; text-align: left; }
  thead th { position: sticky; top: 0; background: #fff; z-index: 2; font-weight: 600;
             color: var(--muted); border-bottom: 2px solid var(--border); font-size: 12px; }
  thead th.num, td.num { text-align: center; font-variant-numeric: tabular-nums; }
  thead th.yr { text-align: center; border-left: 1px solid var(--border); color: var(--text); }
  tr.grp td { background: var(--grp); font-weight: 700; border-top: 1px solid var(--border);
              border-left: 3px solid var(--grp-line); cursor: pointer; user-select: none; }
  tr.grp .tri { display: inline-block; width: 12px; color: var(--accent); }
  td.cli { position: sticky; left: 0; background: inherit; z-index: 1; }
  tr.row td.cli { padding-left: 26px; }
  tr.row:nth-child(even) td { background: var(--band); }
  tr.row:hover td { background: var(--hover); }
  td.date { text-align: center; min-width: 120px; }
  td.mnum { text-align: center; min-width: 26px; color: var(--text); }
  td.mnum.zero { color: #c7ccd1; }
  .colhdr th.date { text-align: center; min-width: 120px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }

  .exp-wrap { position: relative; display: inline-block; }
  .exp-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 50;
              min-width: 246px; background: #fff; border: 1px solid #d0d7de;
              border-radius: 8px; box-shadow: 0 8px 24px rgba(27,31,36,.16);
              padding: 6px; display: none; text-align: left; }
  .exp-menu.open { display: block; }
  .exp-menu button { display: block; width: 100%; text-align: left; background: none;
                     border: 0; border-radius: 6px; padding: 7px 10px; cursor: pointer;
                     font: inherit; font-size: 13px; color: #24292f; }
  .exp-menu button:hover { background: #eef4fb; }
  .exp-menu button b { display: block; font-weight: 600; }
  .exp-menu button span { display: block; font-size: 11px; color: #656d76; margin-top: 1px; }
  .exp-busy { opacity: .6; pointer-events: none; }

</style>
</head>

    </div>
  </div>
  <div class="wrap"><table id="grid"><thead id="head"></thead><tbody id="body"></tbody></table></div>
</main>

      eo.setUint16(4, 0, true);
      eo.setUint16(6, 0, true);
      eo.setUint16(8, files.length, true);
      eo.setUint16(10, files.length, true);
      eo.setUint32(12, cdSize, true);
      eo.setUint32(16, offset, true);
      eo.setUint16(20, 0, true);
      return new Blob(parts.concat(central, [new Uint8Array(eo.buffer)]), { type: mime });
    });
  }

  var XMLDECL = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n';
  var RELS_NS = 'http://schemas.openxmlformats.org/package/2006/relationships';
  var OD_REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';

  // ---------- CSV ----------
  function csvCell(v) {
    var s = (v == null) ? '' : String(v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function exportCsv(o) {
    var matrix = [o.headers].concat(o.rows);
    var csv = matrix.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
    // Leading BOM so Excel detects UTF-8 instead of the ANSI codepage.
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    download(blob, safeName(o.name) + '_' + stamp() + '.csv');
    return Promise.resolve();
  }

  // ---------- Word (.docx) ----------
  function wRun(text, o) {
    o = o || {};
    var rPr = '<w:rPr><w:rFonts w:ascii="Segoe UI" w:hAnsi="Segoe UI" w:cs="Segoe UI"/>'
            + (o.bold ? '<w:b/>' : '')
            + (o.color ? '<w:color w:val="' + o.color + '"/>' : '')
            + '<w:sz w:val="' + (o.sz || 18) + '"/><w:szCs w:val="' + (o.sz || 18) + '"/></w:rPr>';
    return '<w:r>' + rPr + '<w:t xml:space="preserve">' + xml(text) + '</w:t></w:r>';
  }

  function wPara(text, o) {
    o = o || {};
    var pPr = '<w:pPr>'
            + '<w:spacing w:before="' + (o.before || 0) + '" w:after="' + (o.after == null ? 60 : o.after)
            + '" w:line="240" w:lineRule="auto"/>'
            + (o.align ? '<w:jc w:val="' + o.align + '"/>' : '')
            + '</w:pPr>';
    return '<w:p>' + pPr + wRun(text, o) + '</w:p>';
  }

  function wCell(text, width, o) {
    o = o || {};
    return '<w:tc><w:tcPr><w:tcW w:w="' + width + '" w:type="dxa"/>'
         + (o.fill ? '<w:shd w:val="clear" w:color="auto" w:fill="' + o.fill + '"/>' : '')
         + '<w:vAlign w:val="center"/></w:tcPr>'
         + wPara(text, { bold: o.bold, color: o.color, sz: o.sz, align: o.align, after: 20, before: 20 })
         + '</w:tc>';
  }

  function docxParts(o) {
    var headers = o.headers, rows = o.rows;
    var wide = headers.length > 8;
    var sz = wide ? 15 : 17;                       // half-points (7.5pt / 8.5pt)
    var cols = distribute(14400, colWeights(headers, rows));   // landscape letter text width
    var num = numericCols(headers, rows);

    var border = function (tag) {
      return '<w:' + tag + ' w:val="single" w:sz="4" w:space="0" w:color="' + LINE + '"/>';
    };

    var body = ''
      + wPara(o.title, { bold: true, sz: 36, color: ACCENT_DK, after: 40 })
      + (o.subtitle ? wPara(o.subtitle, { sz: 18, color: MUTED, after: 20 }) : '')
      + wPara('Generated ' + nowText() + '  ·  ' + rows.length.toLocaleString('en-US')
              + ' row' + (rows.length === 1 ? '' : 's'), { sz: 16, color: MUTED, after: 160 })
      + (o.note ? wPara(o.note, { sz: 16, color: MUTED, after: 160 }) : '');

    var tbl = '<w:tbl><w:tblPr><w:tblW w:w="14400" w:type="dxa"/>'
      + '<w:tblBorders>' + border('top') + border('left') + border('bottom')
      + border('right') + border('insideH') + border('insideV') + '</w:tblBorders>'
      + '<w:tblLayout w:type="fixed"/>'
      + '<w:tblCellMar><w:top w:w="20" w:type="dxa"/><w:left w:w="70" w:type="dxa"/>'
      + '<w:bottom w:w="20" w:type="dxa"/><w:right w:w="70" w:type="dxa"/></w:tblCellMar>'
      + '</w:tblPr><w:tblGrid>';
    cols.forEach(function (w) { tbl += '<w:gridCol w:w="' + w + '"/>'; });
    tbl += '</w:tblGrid>';

    // Header row, repeated at the top of every page.
    tbl += '<w:tr><w:trPr><w:tblHeader/><w:cantSplit/></w:trPr>';
    headers.forEach(function (h, i) {
      tbl += wCell(h, cols[i], { bold: true, fill: ACCENT, color: 'FFFFFF', sz: sz,
                                 align: num[i] ? 'right' : 'left' });
    });
    tbl += '</w:tr>';

    rows.forEach(function (r, ri) {
      tbl += '<w:tr><w:trPr><w:cantSplit/></w:trPr>';
      headers.forEach(function (h, i) {
        tbl += wCell(r[i] == null ? '' : r[i], cols[i],
                     { sz: sz, fill: (ri % 2) ? BAND : null, align: num[i] ? 'right' : 'left' });
      });
      tbl += '</w:tr>';
    });
    tbl += '</w:tbl>';

    var sect = '<w:sectPr><w:pgSz w:w="15840" w:h="12240" w:orient="landscape"/>'
      + '<w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720"'
      + ' w:header="360" w:footer="360" w:gutter="0"/></w:sectPr>';

    var doc = XMLDECL
      + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
      + '<w:body>' + body + tbl + '<w:p><w:pPr><w:spacing w:after="0"/></w:pPr></w:p>'
      + sect + '</w:body></w:document>';

    var ct = XMLDECL
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
      + '</Types>';

    var rels = XMLDECL
      + '<Relationships xmlns="' + RELS_NS + '">'
      + '<Relationship Id="rId1" Type="' + OD_REL + '/officeDocument" Target="word/document.xml"/>'
      + '</Relationships>';

    return [
      { name: '[Content_Types].xml', data: ct },
      { name: '_rels/.rels', data: rels },
      { name: 'word/document.xml', data: doc }
    ];
  }

  function buildDocx(o) {
    return zipBlob(docxParts(o),
      'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
  }

  function exportWord(o) {
    if (o.rows.length > WORD_WARN_ROWS &&
        !confirm(o.rows.length.toLocaleString('en-US') + ' rows is a very large Word table and may take '
                 + 'a while to open.\n\nExport anyway? (Cancel, then narrow the filters or use the Excel '
                 + 'export for a data set this size.)')) {
      return Promise.resolve();
    }
    return buildDocx(o).then(function (blob) {
      download(blob, safeName(o.name) + '_' + stamp() + '.docx');
    });
  }

  // ---------- PowerPoint (.pptx) ----------
  var SLIDE_W = 12192000, SLIDE_H = 6858000;      // 13.333in x 7.5in (16:9)
  var MARGIN = 457200;                            // 0.5in
  var TABLE_W = SLIDE_W - 2 * MARGIN;
  var TABLE_Y = 1230000;
  var ROW_H = 219456;                             // 0.24in
  var PPT_ROWS_PER_SLIDE = 18;

  function aRun(text, o) {
    o = o || {};
    return '<a:r><a:rPr lang="en-US" sz="' + (o.sz || 1000) + '"' + (o.bold ? ' b="1"' : '') + '>'
         + '<a:solidFill><a:srgbClr val="' + (o.color || '24292F') + '"/></a:solidFill>'
         + '<a:latin typeface="Segoe UI"/></a:rPr>'
         + '<a:t>' + xml(text) + '</a:t></a:r>';
  }

  function aPara(text, o) {
    o = o || {};
    return '<a:p><a:pPr algn="' + (o.align || 'l') + '"/>' + aRun(text, o) + '</a:p>';
  }

  function textBox(id, name, x, y, cx, cy, paras) {
    return '<p:sp><p:nvSpPr><p:cNvPr id="' + id + '" name="' + xml(name) + '"/>'
         + '<p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr>'
         + '<p:spPr><a:xfrm><a:off x="' + x + '" y="' + y + '"/>'
         + '<a:ext cx="' + cx + '" cy="' + cy + '"/></a:xfrm>'
         + '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></p:spPr>'
         + '<p:txBody><a:bodyPr wrap="square" rtlCol="0" anchor="t"/><a:lstStyle/>'
         + paras + '</p:txBody></p:sp>';
  }

  function tblCell(text, o) {
    o = o || {};
    var ln = function (tag) {
      return '<a:' + tag + ' w="6350" cap="flat" cmpd="sng" algn="ctr">'
           + '<a:solidFill><a:srgbClr val="' + LINE + '"/></a:solidFill>'
           + '<a:prstDash val="solid"/></a:' + tag + '>';
    };
    return '<a:tc><a:txBody><a:bodyPr/><a:lstStyle/>'
         + aPara(text, { sz: o.sz, bold: o.bold, color: o.color, align: o.align })
         + '</a:txBody>'
         + '<a:tcPr marL="45720" marR="45720" marT="18288" marB="18288" anchor="ctr">'
         + ln('lnL') + ln('lnR') + ln('lnT') + ln('lnB')
         + '<a:solidFill><a:srgbClr val="' + (o.fill || 'FFFFFF') + '"/></a:solidFill>'
         + '</a:tcPr></a:tc>';
  }

  function tableFrame(id, headers, rows, cols, sz, startBand) {
    var s = '<p:graphicFrame><p:nvGraphicFramePr>'
      + '<p:cNvPr id="' + id + '" name="Table"/>'
      + '<p:cNvGraphicFramePr><a:graphicFrameLocks noGrp="1"/></p:cNvGraphicFramePr>'
      + '<p:nvPr/></p:nvGraphicFramePr>'
      + '<p:xfrm><a:off x="' + MARGIN + '" y="' + TABLE_Y + '"/>'
      + '<a:ext cx="' + TABLE_W + '" cy="' + (ROW_H * (rows.length + 1)) + '"/></p:xfrm>'
      + '<a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/table">'
      + '<a:tbl><a:tblPr firstRow="1"/><a:tblGrid>';
    cols.forEach(function (w) { s += '<a:gridCol w="' + w + '"/>'; });
    s += '</a:tblGrid>';

    var num = numericCols(headers, rows);

    s += '<a:tr h="' + ROW_H + '">';
    headers.forEach(function (h, i) {
      s += tblCell(h, { bold: true, fill: ACCENT, color: 'FFFFFF', sz: sz,
                        align: num[i] ? 'r' : 'l' });
    });
    s += '</a:tr>';

    rows.forEach(function (r, ri) {
      s += '<a:tr h="' + ROW_H + '">';
      headers.forEach(function (h, i) {
        s += tblCell(r[i] == null ? '' : r[i],
                     { sz: sz, fill: ((ri + startBand) % 2) ? BAND : 'FFFFFF',
                       align: num[i] ? 'r' : 'l' });
      });
      s += '</a:tr>';
    });

    return s + '</a:tbl></a:graphicData></a:graphic></p:graphicFrame>';
  }

  function slideXml(shapes) {
    return XMLDECL
      + '<p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"'
      + ' xmlns:r="' + OD_REL + '"'
      + ' xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">'
      + '<p:cSld><p:spTree>'
      + '<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>'
      + '<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/>'
      + '<a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>'
      + shapes
      + '</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sld>';
  }

  function emptyTree() {
    return '<p:spTree>'
      + '<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>'
      + '<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/>'
      + '<a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>'
      + '</p:spTree>';
  }

  function themeXml() {
    var accents = ['4472C4', 'ED7D31', 'A5A5A5', 'FFC000', '5B9BD5', '70AD47'];
    var clr = '';
    accents.forEach(function (hex, i) {
      clr += '<a:accent' + (i + 1) + '><a:srgbClr val="' + hex + '"/></a:accent' + (i + 1) + '>';
    });
    var solid = '<a:solidFill><a:schemeClr val="phClr"/></a:solidFill>';
    var line = '<a:ln w="6350" cap="flat" cmpd="sng" algn="ctr">' + solid
             + '<a:prstDash val="solid"/></a:ln>';
    var eff = '<a:effectStyle><a:effectLst/></a:effectStyle>';
    return XMLDECL
      + '<a:theme xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" name="Office">'
      + '<a:themeElements>'
      + '<a:clrScheme name="Office">'
      + '<a:dk1><a:sysClr val="windowText" lastClr="000000"/></a:dk1>'
      + '<a:lt1><a:sysClr val="window" lastClr="FFFFFF"/></a:lt1>'
      + '<a:dk2><a:srgbClr val="44546A"/></a:dk2>'
      + '<a:lt2><a:srgbClr val="E7E6E6"/></a:lt2>'
      + clr
      + '<a:hlink><a:srgbClr val="0563C1"/></a:hlink>'
      + '<a:folHlink><a:srgbClr val="954F72"/></a:folHlink>'
      + '</a:clrScheme>'
      + '<a:fontScheme name="Office">'
      + '<a:majorFont><a:latin typeface="Segoe UI"/><a:ea typeface=""/><a:cs typeface=""/></a:majorFont>'
      + '<a:minorFont><a:latin typeface="Segoe UI"/><a:ea typeface=""/><a:cs typeface=""/></a:minorFont>'
      + '</a:fontScheme>'
      + '<a:fmtScheme name="Office">'
      + '<a:fillStyleLst>' + solid + solid + solid + '</a:fillStyleLst>'
      + '<a:lnStyleLst>' + line + line + line + '</a:lnStyleLst>'
      + '<a:effectStyleLst>' + eff + eff + eff + '</a:effectStyleLst>'
      + '<a:bgFillStyleLst>' + solid + solid + solid + '</a:bgFillStyleLst>'
      + '</a:fmtScheme>'
      + '</a:themeElements></a:theme>';
  }

  function pptxParts(o) {
    var headers = o.headers;
    var all = o.rows;
    var truncated = all.length > PPT_MAX_ROWS;
    var rows = truncated ? all.slice(0, PPT_MAX_ROWS) : all;
    var sz = o.fontSz || (headers.length > 10 ? 800 : (headers.length > 7 ? 900 : 1000));
    var perSlide = o.rowsPerSlide || PPT_ROWS_PER_SLIDE;
    var cols = distribute(TABLE_W, colWeights(headers, rows));

    // --- title slide ---
    var titleShapes =
        textBox(2, 'Title', MARGIN, 2057400, TABLE_W, 900000,
                aPara(o.title, { sz: 3200, bold: true, color: ACCENT_DK }))
      + textBox(3, 'Subtitle', MARGIN, 3000000, TABLE_W, 1500000,
                (o.subtitle ? aPara(o.subtitle, { sz: 1600, color: ACCENT }) : '')
                + aPara('Generated ' + nowText(), { sz: 1200, color: MUTED })
                + aPara(all.length.toLocaleString('en-US') + ' row'
                        + (all.length === 1 ? '' : 's')
                        + (truncated ? '  ·  showing the first '
                           + PPT_MAX_ROWS.toLocaleString('en-US')
                           + ' in this deck (use the Excel export for the full set)' : ''),
                        { sz: 1200, color: truncated ? 'B54708' : MUTED })
                + (o.note ? aPara(o.note, { sz: 1200, color: MUTED }) : ''));

    var slides = [slideXml(titleShapes)];

    var pages = Math.max(1, Math.ceil(rows.length / perSlide));
    for (var p = 0; p < pages; p++) {
      var chunk = rows.slice(p * perSlide, (p + 1) * perSlide);
      var heading = o.title + (pages > 1 ? '  (' + (p + 1) + ' of ' + pages + ')' : '');
      var shapes =
          textBox(2, 'Heading', MARGIN, 320000, TABLE_W, 500000,
                  aPara(heading, { sz: 1800, bold: true, color: ACCENT_DK }))
        + textBox(3, 'Sub', MARGIN, 780000, TABLE_W, 340000,
                  aPara((o.subtitle || '') +
                        (chunk.length ? '   ·   rows ' + (p * perSlide + 1)
                         + '–' + (p * perSlide + chunk.length) : ''),
                        { sz: 1000, color: MUTED }))
        + tableFrame(4, headers, chunk, cols, sz, p * perSlide);
      slides.push(slideXml(shapes));
    }

    // --- package ---
    var n = slides.length;
    var ct = XMLDECL
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/ppt/presentation.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml"/>'
      + '<Override PartName="/ppt/slideMasters/slideMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideMaster+xml"/>'
      + '<Override PartName="/ppt/slideLayouts/slideLayout1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideLayout+xml"/>'
      + '<Override PartName="/ppt/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>';
    for (var i = 1; i <= n; i++) {
      ct += '<Override PartName="/ppt/slides/slide' + i + '.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>';
    }
    ct += '</Types>';

    var rootRels = XMLDECL + '<Relationships xmlns="' + RELS_NS + '">'
      + '<Relationship Id="rId1" Type="' + OD_REL + '/officeDocument" Target="ppt/presentation.xml"/>'
      + '</Relationships>';

    var presRels = XMLDECL + '<Relationships xmlns="' + RELS_NS + '">'
      + '<Relationship Id="rId1" Type="' + OD_REL + '/slideMaster" Target="slideMasters/slideMaster1.xml"/>';
    for (var j = 1; j <= n; j++) {
      presRels += '<Relationship Id="rId' + (j + 1) + '" Type="' + OD_REL
        + '/slide" Target="slides/slide' + j + '.xml"/>';
    }
    presRels += '<Relationship Id="rId' + (n + 2) + '" Type="' + OD_REL
      + '/theme" Target="theme/theme1.xml"/></Relationships>';

    var sldIds = '';
    for (var k = 1; k <= n; k++) {
      sldIds += '<p:sldId id="' + (255 + k) + '" r:id="rId' + (k + 1) + '"/>';
    }
    var pres = XMLDECL
      + '<p:presentation xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"'
      + ' xmlns:r="' + OD_REL + '"'
      + ' xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">'
      + '<p:sldMasterIdLst><p:sldMasterId id="2147483648" r:id="rId1"/></p:sldMasterIdLst>'
      + '<p:sldIdLst>' + sldIds + '</p:sldIdLst>'
      + '<p:sldSz cx="' + SLIDE_W + '" cy="' + SLIDE_H + '"/>'
      + '<p:notesSz cx="6858000" cy="9144000"/>'
      + '</p:presentation>';

    var master = XMLDECL
      + '<p:sldMaster xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"'
      + ' xmlns:r="' + OD_REL + '"'
      + ' xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main">'
      + '<p:cSld>' + emptyTree() + '</p:cSld>'
      + '<p:clrMap bg1="lt1" tx1="dk1" bg2="lt2" tx2="dk2" accent1="accent1" accent2="accent2"'
      + ' accent3="accent3" accent4="accent4" accent5="accent5" accent6="accent6"'
      + ' hlink="hlink" folHlink="folHlink"/>'
      + '<p:sldLayoutIdLst><p:sldLayoutId id="2147483649" r:id="rId1"/></p:sldLayoutIdLst>'
      + '</p:sldMaster>';

    var masterRels = XMLDECL + '<Relationships xmlns="' + RELS_NS + '">'
      + '<Relationship Id="rId1" Type="' + OD_REL + '/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>'
      + '<Relationship Id="rId2" Type="' + OD_REL + '/theme" Target="../theme/theme1.xml"/>'
      + '</Relationships>';

    var layout = XMLDECL
      + '<p:sldLayout xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"'
      + ' xmlns:r="' + OD_REL + '"'
      + ' xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main"'
      + ' type="blank" preserve="1">'
      + '<p:cSld name="Blank">' + emptyTree() + '</p:cSld>'
      + '<p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sldLayout>';

    var layoutRels = XMLDECL + '<Relationships xmlns="' + RELS_NS + '">'
      + '<Relationship Id="rId1" Type="' + OD_REL + '/slideMaster" Target="../slideMasters/slideMaster1.xml"/>'
      + '</Relationships>';

    var slideRels = XMLDECL + '<Relationships xmlns="' + RELS_NS + '">'
      + '<Relationship Id="rId1" Type="' + OD_REL + '/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>'
      + '</Relationships>';

    var files = [
      { name: '[Content_Types].xml', data: ct },
      { name: '_rels/.rels', data: rootRels },
      { name: 'ppt/presentation.xml', data: pres },
      { name: 'ppt/_rels/presentation.xml.rels', data: presRels },
      { name: 'ppt/slideMasters/slideMaster1.xml', data: master },
      { name: 'ppt/slideMasters/_rels/slideMaster1.xml.rels', data: masterRels },
      { name: 'ppt/slideLayouts/slideLayout1.xml', data: layout },
      { name: 'ppt/slideLayouts/_rels/slideLayout1.xml.rels', data: layoutRels },
      { name: 'ppt/theme/theme1.xml', data: themeXml() }
    ];
    slides.forEach(function (s, i) {
      files.push({ name: 'ppt/slides/slide' + (i + 1) + '.xml', data: s });
      files.push({ name: 'ppt/slides/_rels/slide' + (i + 1) + '.xml.rels', data: slideRels });
    });
    return files;
  }

  function buildPptx(o) {
    return zipBlob(pptxParts(o),
      'application/vnd.openxmlformats-officedocument.presentationml.presentation');
  }

  function exportPpt(o) {
    if (o.rows.length > PPT_MAX_ROWS &&
        !confirm(o.rows.length.toLocaleString('en-US') + ' rows would make an unreadable deck.\n\n'
                 + 'Continue with the first ' + PPT_MAX_ROWS.toLocaleString('en-US')
                 + ' rows? (Cancel, then narrow the filters, or use the Excel export for '
                 + 'the whole data set.)')) {
      return Promise.resolve();
    }
    return buildPptx(o).then(function (blob) {
      download(blob, safeName(o.name) + '_' + stamp() + '.pptx');
    });
  }

  var HANDLERS = { csv: exportCsv, word: exportWord, ppt: exportPpt };

  function run(fmt, o) {
    var fn = HANDLERS[fmt];
    if (!fn) return Promise.resolve();
    if (!o || !o.headers) return Promise.resolve();
    o.rows = o.rows || [];
    if (!o.rows.length && fmt !== 'csv') {
      alert('Nothing to export - no rows match the current filters.');
      return Promise.resolve();
    }
    return fn(o);
  }

  // Wire the split button + dropdown. getExport(fmt) supplies the current view;
  // it receives the chosen format so a report can tune headers per format.
  function wire(btnId, menuId, getExport) {
    var btn = document.getElementById(btnId);
    var menu = document.getElementById(menuId);
    if (!btn || !menu) return;

    var close = function () { menu.classList.remove('open'); };
    // The menu hangs off the button's right edge by default, but the button can
    // wrap to the left of a flex row - flip alignment if that clips it.
    var open = function () {
      menu.style.left = '';
      menu.style.right = '';
      menu.classList.add('open');
      var r = menu.getBoundingClientRect();
      if (r.left < 8) { menu.style.left = '0'; menu.style.right = 'auto'; }
      else if (r.right > window.innerWidth - 8) { menu.style.right = '0'; menu.style.left = 'auto'; }
    };
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.classList.contains('open')) close(); else open();
    });
    document.addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

    menu.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('button[data-fmt]') : null;
      if (!t) return;
      e.stopPropagation();
      close();
      var fmt = t.dataset.fmt;
      btn.classList.add('exp-busy');
      var label = btn.innerHTML;
      btn.innerHTML = 'Building…';
      Promise.resolve()
        .then(function () { return run(fmt, getExport(fmt)); })
        .catch(function (err) {
          console.error(err);
          alert('Export failed: ' + (err && err.message ? err.message : err));
        })
        .then(function () {
          btn.classList.remove('exp-busy');
          btn.innerHTML = label;
        });
    });
  }

  return { wire: wire, run: run, buildDocx: buildDocx, buildPptx: buildPptx,
           _docxParts: docxParts, _pptxParts: pptxParts };
})();
</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const MONTHS = DATA.months;                 // newest first
  const ROWS = DATA.rows;
  const CATS = ['All', 'PI', 'Subro', 'Rx', 'Rx Med'];
  const MNAME = ['', 'Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let state = { cat: 'All', view: 'dates', search: '', collapsed: new Set() };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => (s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));

  function fmtDate(s) {
    if (!s) return '';
    const p = s.slice(0, 10).split('-');
    if (p.length < 3) return '';
    return (+p[1]) + '/' + (+p[2]) + '/' + p[0];
  }

  // Build tab buttons
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.textContent = c; b.dataset.cat = c;
    if (c === state.cat) b.className = 'active';
    b.addEventListener('click', () => { state.cat = c; syncSeg('tabs', 'cat'); render(); });
    $('tabs').appendChild(b);
  });
  function syncSeg(segId, key) {
    for (const b of $(segId).children)
      b.classList.toggle('active', (b.dataset.cat || b.dataset.view) === state[key]);
  }
  for (const b of $('views').children)
    b.addEventListener('click', () => { state.view = b.dataset.view; syncSeg('views', 'view'); render(); });
  $('search').addEventListener('input', () => { state.search = $('search').value; render(); });
  $('toggle-all').addEventListener('click', () => {
    const groups = currentGroups();
    if (state.collapsed.size < groups.length) groups.forEach(g => state.collapsed.add(g.parent));
    else state.collapsed.clear();
    render();
  });

  function filteredRows() {
    const q = state.search.trim().toLowerCase();
    return ROWS.filter(r => {
      if (state.cat !== 'All' && !r.cats.includes(state.cat)) return false;
      if (q && r.client.toLowerCase().indexOf(q) === -1 && r.parent.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
  }

  function currentGroups() {
    const byParent = {};
    for (const r of filteredRows()) (byParent[r.parent] = byParent[r.parent] || []).push(r);
    return Object.keys(byParent).sort((a, b) => a.toLowerCase() < b.toLowerCase() ? -1 : 1)
      .map(parent => ({ parent, rows: byParent[parent].slice().sort((a, b) => a.client.toLowerCase() < b.client.toLowerCase() ? -1 : 1) }));
  }

  // ---- Export (Excel CSV / Word / PowerPoint) ----------------------------
  // Always the full filtered set for the active tab/view, ignoring collapse.
  function buildExport(fmt) {
    const headers = [], rows = [];
    if (state.view === 'dates') {
      headers.push('Parent', 'Client', 'Max PayDate Loaded', 'Max PayDate Certified', 'Max Cert Date');
      for (const g of currentGroups())
        for (const r of g.rows)
          rows.push([g.parent, r.client, fmtDate(r.mpl), fmtDate(r.mpc), fmtDate(r.maxcert)]);
    } else {
      // 27 columns is tight in Word/PowerPoint, so shorten the year there.
      const mlabel = (mk) => MNAME[mk.m] + (fmt === 'csv' ? ' ' + mk.y : " '" + String(mk.y).slice(2));
      headers.push('Parent', 'Client', ...MONTHS.map(mlabel));
      for (const g of currentGroups())
        for (const r of g.rows)
          rows.push([g.parent, r.client].concat(MONTHS.map(mk => r.m[mk.key] || 0)));
    }
    const viewName = state.view === 'dates' ? 'MaxPayDates' : 'Certs';
    const viewLabel = state.view === 'dates'
      ? 'Max Pay Dates'
      : 'Certifications by month (' + MONTHS.length + ' months)';
    const bits = ['Category: ' + state.cat, 'View: ' + viewLabel];
    if (state.search.trim()) bits.push('Find: "' + state.search.trim() + '"');
    return {
      name: 'TrafficReport_' + viewName + '_' + state.cat.replace(/[^A-Za-z0-9]/g, ''),
      title: 'Traffic Report — ' + viewLabel,
      subtitle: bits.join('  ·  '),
      note: 'Source: trgutil10 / DHTStats',
      headers: headers,
      rows: rows,
      // Month headers wrap to two lines in the certs grid, so fit fewer rows.
      rowsPerSlide: state.view === 'dates' ? 18 : 16,
    };
  }
  RptExport.wire('btn-export', 'exp-menu', buildExport);

  function renderHead() {
    const head = $('head');
    if (state.view === 'dates') {
      head.innerHTML = '<tr class="colhdr"><th class="cli">Client</th>'
        + '<th class="date">Max PayDate Loaded</th><th class="date">Max PayDate Certified</th>'
        + '<th class="date">Max Cert Date</th></tr>';
      return;
    }
    // certs: two header rows (year spans + month numbers)
    let yr = '<tr><th class="cli" rowspan="2">Client</th>';
    let i = 0;
    while (i < MONTHS.length) {
      let j = i; while (j < MONTHS.length && MONTHS[j].y === MONTHS[i].y) j++;
      yr += '<th class="yr" colspan="' + (j - i) + '">' + MONTHS[i].y + '</th>';
      i = j;
    }
    yr += '</tr>';
    let mo = '<tr>';
    for (const mk of MONTHS) mo += '<th class="num" title="' + MNAME[mk.m] + ' ' + mk.y + '">' + mk.m + '</th>';
    mo += '</tr>';
    head.innerHTML = yr + mo;
  }

  function render() {
    renderHead();
    const groups = currentGroups();
    const body = $('body');
    const ncol = state.view === 'dates' ? 3 : MONTHS.length;
    body.innerHTML = '';

    if (groups.length === 0) {
      body.innerHTML = '<tr><td class="empty" colspan="' + (ncol + 1) + '">No clients match.</td></tr>';
      $('toggle-all').textContent = 'Collapse all';
      return;
    }

    let html = '';
    for (const g of groups) {
      const collapsed = state.collapsed.has(g.parent);
      html += '<tr class="grp" data-p="' + esc(g.parent) + '"><td class="cli">'
        + '<span class="tri">' + (collapsed ? '▸' : '▾') + '</span>' + esc(g.parent) + '</td>'
        + '<td colspan="' + ncol + '"></td></tr>';
      if (collapsed) continue;
      for (const r of g.rows) {
        html += '<tr class="row"><td class="cli">' + esc(r.client) + '</td>';
        if (state.view === 'dates') {
          html += '<td class="date">' + fmtDate(r.mpl) + '</td>'
                + '<td class="date">' + fmtDate(r.mpc) + '</td>'
                + '<td class="date">' + fmtDate(r.maxcert) + '</td>';
        } else {
          for (const mk of MONTHS) {
            const v = r.m[mk.key];
            html += '<td class="mnum' + (v ? '' : ' zero') + '">' + (v || '') + '</td>';
          }
        }
        html += '</tr>';
      }
    }
    body.innerHTML = html;

    for (const tr of body.querySelectorAll('tr.grp')) {
      tr.addEventListener('click', () => {
        const p = tr.dataset.p;
        if (state.collapsed.has(p)) state.collapsed.delete(p); else state.collapsed.add(p);
        render();
      });
    }
    $('toggle-all').textContent = state.collapsed.size >= groups.length ? 'Expand all' : 'Collapse all';
  }

  render();
})();
</script>
</body>
</html>
